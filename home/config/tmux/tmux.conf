# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

# Set true color support
set -ga terminal-overrides ",xterm-256color*:Tc"
set-option -g default-terminal "xterm-256color"

# Set prefix to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set-option -g set-clipboard on

# Set a longer history limit
set -g history-limit 10000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Enable mouse mode
set -g mouse on

# Set vi-style keybindings for copy mode
setw -g mode-keys vi

# Reduce escape time for faster responsiveness
set -sg escape-time 0

# Disable automatic window renaming
set-option -g allow-rename off

# Quiet
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# -----------------------------------------------------------------------------
# KEYBINDINGS
# -----------------------------------------------------------------------------

# Reload config with r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Sourced ~/.config/tmux/tmux.conf"

# Split panes with | and -
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Create new window with c
bind c new-window -c "#{pane_current_path}"

# Pane navigation with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation with Alt + hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Synchronize panes
bind x setw synchronize-panes

# Create a new session
bind C command-prompt -p "New Session:" "new-session -s '%%'"

# -----------------------------------------------------------------------------
# THEME (Tokyonight)
# -----------------------------------------------------------------------------
source-file ~/.config/tmux/theme.conf

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# # Yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

bind-key y display-popup -d '#{pane_current_path}' -x R -h 95% -w 95% -E 'tmux new-session yazi \; set status off'
bind-key e display-popup -w 95% -h 90% -E "tmux capture-pane -Jp -S- | hx -"
