context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            aec.args = {
                webrtc.noise_suppression  = true
                webrtc.gain_control       = true
                webrtc.high_pass_filter   = true
                webrtc.voice_detection    = true
                webrtc.extended_filter    = true
            }
            capture.props = {
                node.name    = "capture.clean_camera_mic"
                node.target  = "alsa_input.usb-_USB_Camera_985100000000100-02.pro-input-0"
                node.passive = true
            }
            source.props = {
                node.name        = "clean_camera_mic"
                node.description  = "Clean Mic (Camera, NS+AGC)"
            }
            sink.props = {
                node.name        = "echo_cancel_ref_sink"
                node.description  = "Echo Reference (ignore)"
            }
        }
    }
]
